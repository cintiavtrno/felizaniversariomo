<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feliz aniversário</title>
<style>
:root{--bg:#f6d3c8;--ink:#4a2519;--chip:#e8aaa6;--pink:#ff5c93;--gh:100px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mono{font-family:ui-monospace,"Courier New",monospace}

#title{position:fixed;top:max(3vh,env(safe-area-inset-top));left:0;right:0;margin:0;padding:0 14px;text-align:center;font-size:clamp(26px,6.4vw,60px);line-height:1.12;font-weight:900;color:var(--ink);text-shadow:3px 3px 0 #ff8fb4;pointer-events:none;z-index:2}
#title .l{display:inline-block;animation:wave 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*80ms)}
#title .sp,#love .sp{display:inline-block;width:.28em}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.14em)}}

#love{position:fixed;left:0;right:0;top:15vh;margin:0;text-align:center;pointer-events:none;z-index:2;line-height:1.02}
#love .l2{display:inline-block;opacity:0;font-weight:900;font-size:clamp(48px,14vw,150px);color:#fff5ee;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:.05em .06em 0 var(--pink)}
#love.on .l2{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),calc(var(--i)*70ms + 900ms)}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-25deg)}60%{opacity:1;transform:scale(1.3) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.08em)}}

#toast{position:fixed;left:50%;top:clamp(110px,22vh,210px);transform:translateX(-50%) scale(.85);opacity:0;max-width:88vw;text-align:center;background:#fff5ee;color:var(--ink);border:3px solid var(--pink);border-radius:14px;box-shadow:4px 4px 0 #b24a6b;padding:10px 16px;font-weight:800;font-size:clamp(16px,4vw,22px);pointer-events:none;z-index:3;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}

#hint{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;color:var(--ink);background:var(--chip);border-radius:8px;padding:6px 12px;font:800 12px/1.35 ui-monospace,"Courier New",monospace;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;z-index:2}

#heartBtn{position:fixed;z-index:4;background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:50%}
#heartBtn:focus-visible,#again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#again{position:fixed;right:16px;bottom:calc(var(--gh) + 16px);z-index:4;min-height:44px;padding:10px 18px;font:800 14px ui-monospace,"Courier New",monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:#ff8fb4;border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
#again:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){
  #title .l{animation:none}
  #love.on .l2{animation:none;opacity:1}
  #toast{transition:none}
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<h1 id="title"></h1>
<p id="love" role="img" aria-label="te amo muito"></p>
<div id="toast" role="status" aria-live="polite"></div>
<p id="hint"></p>
<button id="heartBtn" type="button" aria-label="Tocar no coração" hidden></button>
<button id="again" type="button" hidden>mais uma vez ♥</button>

  let last = performance.now();

    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (loaded >= total) update(dt); else st.t += 0;
    draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
